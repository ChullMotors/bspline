[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-bspline"
version = "0.1.0"
description = "Differentiable tensor-product B-spline interpolation in PyTorch"
readme = "README.md"
requires-python = ">=3.9"

authors = [{ name = "Chris Hull" }]
license = { file = "LICENSE" }

dependencies = ["torch"]


[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[project.optional-dependencies]
test = ["pytest", "scipy"]